name: SinLuz Keepalive

on:
  schedule:
    # Corre cada 3 dias a las 12:00 UTC
    - cron: '0 12 */3 * *'
  # Permite ejecutarlo manualmente para probar
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          echo "Pinging SinLuz Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://czbdgbvdyauljruiczgy.supabase.co/rest/v1/zonas?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6YmRnYnZkeWF1bGpydWljemd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzkyNzAsImV4cCI6MjEwNjMxNTI3MH0.DwygzbmxOVnFj0ufoKhbFKgO6wSDTHse5nKBm0eLcW4" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6YmRnYnZkeWF1bGpydWljemd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzkyNzAsImV4cCI6MjEwNjMxNTI3MH0.DwygzbmxOVnFj0ufoKhbFKgO6wSDTHse5nKBm0eLcW4")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Keepalive exitoso"
          else
            echo "Keepalive fallo con status $HTTP_STATUS"
            exit 1
          fi
